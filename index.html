<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V2Box Config Updater</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; color: #333; padding: 20px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); max-width: 400px; margin: auto; margin-top: 30px; }
        h2 { color: #007aff; }
        button { background: #007aff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 15px; }
        button:active { background: #005ec4; }
        textarea { width: 100%; height: 120px; margin-top: 15px; border-radius: 8px; border: 1px solid #ccc; padding: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>V2Box Config Helper</h2>
        <p>ទាញយក Config ថ្មីៗពីប្រភពសាធារណៈតំបន់អាស៊ី/សាំងហ្គាស្ទ័រ</p>
        <button onclick="fetchConfigs()">ចុច Update ទាញយក Config</button>
        <textarea id="output" placeholder="Config ថ្មីនឹងបង្ហាញទីនេះ..."></textarea>
        <button style="background: #34c759;" onclick="copyText()">Copy Config</button>
    </div>

    <script>
        async function fetchConfigs() {
            const output = document.getElementById("output");
            output.value = "កំពុងទាញយក...";
            try {
                let res = await fetch("https://raw.githubusercontent.com/freefq/free/master/v2");
                let text = await res.text();
                output.value = text.slice(0, 1000) + "\n...(ទាញយកបានសម្រេច)";
            } catch(e) {
                output.value = "មានបញ្ហាក្នុងការទាញយក សូមព្យាយាមម្តងទៀត។";
            }
        }
        function copyText() {
            const output = document.getElementById("output");
            output.select();
            document.execCommand("copy");
            alert("បាន Copy រួចរាល់!");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>V2Box 4K Crystal Glass</title>
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #020810;
        }

        #bgVideo {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 18px;
        }

        .crystal-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.01) 100%);
            padding: 26px 22px;
            border-radius: 32px;
            border-top: 1.5px solid rgba(255, 255, 255, 0.75);
            border-left: 1.5px solid rgba(255, 255, 255, 0.55);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom: 1.5px solid rgba(255, 255, 255, 0.25);
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.55),
                inset 0 2px 12px rgba(255, 255, 255, 0.45),
                inset 0 -3px 10px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 390px;
            text-align: center;
            color: #ffffff;
        }

        h2 {
            margin: 0 0 6px 0;
            font-size: 22px;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
        }

        p {
            margin: 0 0 18px 0;
            font-size: 13px;
            color: #ffffff;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
        }

        .crystal-btn {
            position: relative;
            overflow: hidden;
            width: 100%;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            border-radius: 50px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.03) 50%, rgba(255, 255, 255, 0.12) 100%);
            border-top: 1.8px solid rgba(255, 255, 255, 0.9);
            border-left: 1.2px solid rgba(255, 255, 255, 0.6);
            border-right: 1.2px solid rgba(255, 255, 255, 0.4);
            border-bottom: 2px solid rgba(255, 255, 255, 0.35);
            box-shadow: 
                0 12px 24px rgba(0, 0, 0, 0.5),
                inset 0 3px 6px rgba(255, 255, 255, 0.85),
                inset 0 -3px 8px rgba(0, 0, 0, 0.25);
            cursor: pointer;
            transition: all 0.15s ease;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
        }

        .crystal-btn:active {
            transform: translateY(4px) scale(0.96);
        }

        .btn-copy {
            margin-top: 14px;
        }

        .sound-btn {
            display: inline-block;
            padding: 9px 20px;
            font-size: 13.5px;
            font-weight: 600;
            color: #ffffff;
            border-radius: 30px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.04) 100%);
            border-top: 1.5px solid rgba(255, 255, 255, 0.85);
            border-bottom: 1.5px solid rgba(255, 255, 255, 0.3);
            border-left: 1px solid rgba(255, 255, 255, 0.5);
            border-right: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.45), inset 0 2px 5px rgba(255, 255, 255, 0.8);
            cursor: pointer;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.9);
        }

        textarea {
            width: 100%;
            height: 130px;
            margin-top: 16px;
            border-radius: 20px;
            border: 1.5px solid rgba(255, 255, 255, 0.5);
            padding: 12px;
            font-size: 13px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.18);
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.45);
            resize: none;
            outline: none;
            user-select: text;
        }

        textarea::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>

    <video id="bgVideo" autoplay loop muted playsinline>
        <source src="pond.mp4" type="video/mp4">
    </video>

    <div class="container">
        <div class="crystal-card">
            <h2>💎 V2Box 4K Crystal</h2>
            <p>Tap Sound button to unmute video</p>

            <button class="sound-btn" id="soundBtn" onclick="toggleSound()">
                🔇 Sound: OFF (Tap to ON)
            </button>

            <button class="crystal-btn" style="margin-top: 14px;" onclick="fetchConfigs()">
                🔄 Update Configs
            </button>

            <textarea id="output" placeholder="Configs will appear here..."></textarea>

            <button class="crystal-btn btn-copy" onclick="copyText()">
                📋 Copy Config
            </button>
        </div>
    </div>

    <script>
        const video = document.getElementById('bgVideo');
        const soundBtn = document.getElementById('soundBtn');

        function toggleSound() {
            if (video.muted) {
                video.muted = false;
                video.play();
                soundBtn.innerHTML = "🔊 Sound: ON";
            } else {
                video.muted = true;
                soundBtn.innerHTML = "🔇 Sound: OFF";
            }
        }

        async function fetchConfigs() {
            const output = document.getElementById("output");
            output.value = "កំពុងទាញយក Config...";
            try {
                // ប្រើប្រាស់ Cors Proxy ដើម្បីការពារកុំឱ្យติด Error ពេលទាញយកតាម GitHub Pages
                let res = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent("https://raw.githubusercontent.com/freefq/free/master/v2"));
                if (!res.ok) throw new Error("Network response was not ok");
                let text = await res.text();
                output.value = text;
            } catch (e) {
                // បើសិនជាមានបញ្ហា វានឹងទាញយកតាម Link ដើមផ្ទាល់
                try {
                    let res2 = await fetch("https://raw.githubusercontent.com/freefq/free/master/v2");
                    let text2 = await res2.text();
                    output.value = text2;
                } catch (err) {
                    output.value = "Warning: មិនអាចទាញយកដោយស្វ័យប្រវត្តបានទេ សូមពិនិត្យប្រព័ន្ធអ៊ីនធឺណិត។";
                }
            }
        }

        function copyText() {
            const output = document.getElementById("output");
            if (!output.value || output.value.includes("កំពុងទាញយក")) {
                alert("គ្មានទិន្នន័យសម្រាប់ Copy ទេ!");
                return;
            }
            output.select();
            output.setSelectionRange(0, 99999); // សម្រាប់ iPhone
            try {
                document.execCommand("copy");
                alert("បាន Copy Config រួចរាល់!");
            } catch (err) {
                alert("សូមทำการ Copy ដោយដៃពីក្នុងប្រអប់!");
            }
        }
    </script>
</body>
</html>

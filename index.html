<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>V2Box Config Updater</title>
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            /* ផ្ទៃខាងក្រោយបែបទឹកសមុទ្រជ្រៅ ដើម្បីឱ្យឃើញដំណក់ទឹកថ្លាច្បាស់ */
            background: radial-gradient(circle at top left, #00c6ff, #0072ff, #0a192f);
            color: #ffffff; 
            padding: 16px; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* ដុំពពុះទឹកអណ្តែតនៅផ្ទៃខាងក្រោយ */
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), rgba(255,255,255,0.05));
            box-shadow: inset 0 0 15px rgba(255,255,255,0.3);
            z-index: 0;
            animation: float 6s ease-in-out infinite;
        }
        .b1 { width: 120px; height: 120px; top: 10%; left: 5%; }
        .b2 { width: 180px; height: 180px; bottom: 8%; right: -20px; animation-delay: 2s; }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        /* ប្រអប់កញ្ចក់ថ្លា 3D */
        .card { 
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 26px 22px; 
            border-radius: 28px; 
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.3),
                inset 0 2px 10px rgba(255, 255, 255, 0.4),
                inset 0 -4px 12px rgba(0, 0, 0, 0.15);
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
        }

        h2 { 
            margin-top: 0;
            margin-bottom: 6px;
            font-size: 22px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }
        p {
            font-size: 13.5px;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 22px;
        }

        /* ប៊ូតុងថ្លាដូចដំណក់ទឹក 3D */
        .water-btn {
            position: relative;
            overflow: hidden;
            width: 100%;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 50px; /* មូលទ្រវែងដូចដំណក់ទឹក */
            background: linear-gradient(135deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.08) 100%);
            box-shadow: 
                0 10px 20px rgba(0, 0, 0, 0.2),
                inset 0 4px 8px rgba(255, 255, 255, 0.65), /* ពន្លឺចាំងខាងលើដំណក់ទឹក */
                inset 0 -4px 10px rgba(0, 114, 255, 0.35); /* ស្រមោលបាតដំណក់ទឹក */
            cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-shadow: 0 1px 4px rgba(0,0,0,0.25);
        }

        /* ចលនាយឺតយារពេលសង្កត់ដៃចុច */
        .water-btn:active {
            transform: scale(0.95);
        }

        .btn-copy {
            margin-top: 14px;
            box-shadow: 
                0 10px 20px rgba(0, 0, 0, 0.2),
                inset 0 4px 8px rgba(255, 255, 255, 0.65),
                inset 0 -4px 10px rgba(52, 199, 89, 0.45);
        }

        /* រង្វង់រលកទឹកពេលចុច (Ripple) */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0.2) 60%, transparent 100%);
            transform: scale(0);
            animation: water-drop 0.65s ease-out;
            pointer-events: none;
        }
        @keyframes water-drop {
            to {
                transform: scale(3.5);
                opacity: 0;
            }
        }

        /* ប្រអប់បង្ហាញកូដបែបកញ្ចក់ស្រអាប់ */
        textarea { 
            width: 100%; 
            height: 135px; 
            margin-top: 18px; 
            border-radius: 18px; 
            border: 1px solid rgba(255, 255, 255, 0.3); 
            padding: 12px; 
            font-size: 13px; 
            color: #ffffff;
            background: rgba(0, 0, 0, 0.22);
            box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.25);
            resize: none;
            outline: none;
        }
        textarea::placeholder {
            color: rgba(255, 255, 255, 0.55);
        }
    </style>
</head>
<body>
    <div class="bubble b1"></div>
    <div class="bubble b2"></div>

    <div class="card">
        <h2>💧 V2Box Liquid Helper</h2>
        <p>ប៉ះដំណក់ទឹកខាងក្រោមដើម្បីទាញយក Config ថ្មី</p>
        
        <button class="water-btn" onclick="createRipple(event); fetchConfigs()">
            ចុច Update ទាញយក Config
        </button>
        
        <textarea id="output" placeholder="Config ថ្មីនឹងបង្ហាញទីនេះ..."></textarea>
        
        <button class="water-btn btn-copy" onclick="createRipple(event); copyText()">
            Copy Config
        </button>
    </div>

    <script>
        // មុខងារបង្កើតរលកទឹកពេលម្រាមដៃប៉ះចំប៊ូតុង
        function createRipple(event) {
            const button = event.currentTarget;
            const circle = document.createElement("span");
            const diameter = Math.max(button.clientWidth, button.clientHeight);
            const radius = diameter / 2;
            const rect = button.getBoundingClientRect();

            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${event.clientX - rect.left - radius}px`;
            circle.style.top = `${event.clientY - rect.top - radius}px`;
            circle.classList.add("ripple");

            const existingRipple = button.getElementsByClassName("ripple")[0];
            if (existingRipple) {
                existingRipple.remove();
            }
            button.appendChild(circle);
        }

        async function fetchConfigs() {
            const output = document.getElementById("output");
            output.value = "កំពុងទាញយក...";
            try {
                let res = await fetch("https://raw.githubusercontent.com/freefq/free/master/v2");
                let text = await res.text();
                output.value = text.slice(0, 1000) + "\n...(ទាញយកបានសម្រេច)";
            } catch(e) {
                output.value = "មានបញ្ហាក្នុងការទាញយក សូមព្យាយាមម្តងទៀត។";
            }
        }

        function copyText() {
            const output = document.getElementById("output");
            if(!output.value) {
                alert("គ្មានទិន្នន័យសម្រាប់ Copy ទេ!");
                return;
            }
            output.select();
            document.execCommand("copy");
            alert("បាន Copy Config រួចរាល់!");
        }
    </script>
</body>
</html>
